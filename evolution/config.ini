# ============================================================
#  Settings for the evolutionary strategy search.
#  Change values here and run:         python run_evo.py
#  CLI flags override the file:         python run_evo.py --pop 300 --gens 40 --seed 3
#  A different config file:             python run_evo.py --config my.ini
# ============================================================

[timeframe]
# Bar size for the whole pipeline: 15m | 1h | 4h | 1d.
# 1d reproduces the original daily engine exactly. Intraday needs data fetched at that
# interval (fetch_data --interval <tf>); windows below are in BARS of this timeframe.
tf = 1d

[universe]
# Which pairs to include in the search. all = all from data.pickle; or a comma-separated list.
# The set depends on the current data.pickle (30 coins by default). Cross-sectional operators
# (cs_*) make sense with >=5-6 pairs. A hand-written list longer than 20 keeps its first 20:
# the cap lives in config.load_config, so editing this file is not a way around it.
# Update/extend: python fetch_data.py --top N --min-years 3   (top-N USDT perps by 24h
# turnover with history >= N years, overwrites data.pickle). Or via the "⟳ Update data.pickle"
# button in the node GUI.
instruments = all
# example: instruments = BTCUSDT, ETHUSDT, BNBUSDT, XRPUSDT, ADAUSDT, DOGEUSDT, LINKUSDT

[simulation]
target_vol = 0.25       # target annualized portfolio volatility (scale of positions/leverage)
exec_cost  = 0.001      # fee, fraction of turnover (0.001 = 10 basis points)

[search]
population  = 200       # how many candidate formulas in one generation
generations = 30       # number of generations  (total candidates ≈ population × generations)
seed        = 7         # RNG seed: the same seed -> the same run
jobs        = auto      # cores for parallelism: a number (e.g. 8) or auto (= cores − 2)

[genome]
max_depth = 8           # max depth of the formula tree
max_size  = 40          # max number of nodes in a formula (the main complexity limiter)

[ga]
tournament     = 5      # selection tournament size (larger -> stronger selection pressure)
elitism        = 6      # how many of the best carry over to the next generation unchanged
random_inject  = 10     # fresh random trees injected into each generation (inflow of novelty)
crossover_prob = 0.6    # crossover fraction (the rest are mutations)

[fitness]
parsimony      = 0.010  # complexity penalty (per formula node)
corr_threshold = 0.70   # correlation threshold for champion dedup (Hall of Fame diversity)
corr_penalty   = 0.5    # penalty for similarity to an already-found champion
hof_capacity   = 15     # Hall of Fame size = how many champions on output
# --- robust multi-block fitness (EXPERIMENTAL, off by default) ---
# blocks >= 2 cuts the selection span (TRAIN start .. TEST start) into that many slices,
# shrinks each slice's Sharpe by `se_penalty` standard errors (Lo 2002) and takes the
# `block_quantile` of the shrunk values as the fitness. Retrospective A/B on the 861-alpha
# July daily library found NO improvement over the legacy fitness: min(TRAIN,VAL) already
# IS a two-block worst-regime rule at the bull/bear boundary (spearman fitness<->TEST
# +0.40 vs +0.40 for the best 3-block variant and +0.26 for 5 blocks — finer slices only
# add per-block noise). Kept as an opt-in for prospective experiments; 0 = legacy.
blocks         = 0
block_quantile = 0.25   # 0 = strict worst block; 0.25 ≈ second-worst
se_penalty     = 1.0    # standard errors subtracted from each block's Sharpe
# The concentration guard is INDEPENDENT of `blocks` and stays on: books that average
# under min_eff_n effective positions (1/HHI) lose fitness — ranking-neutral for
# diversified alphas, but filters the one-coin books (33/861 in the July library).
conc_penalty   = 0.3
min_eff_n      = 3
# The directional guard is independent of everything above and also stays on: a book whose
# average net/gross exceeds max_net is not a cross-sectional alpha, it is the market with
# extra steps — in crypto a long-only basket simply inherits the market's Sharpe, and the
# search will happily mine one because during a bull leg it scores well on TRAIN and VAL.
# net/gross runs -1 (always short) .. +1 (always long); a genuine neutral alpha sits near 0,
# so max_net = 0.5 is generous and only bites books that are genuinely one-sided. The dock
# is proportional to how far past the cap it sits, and reaches net_penalty at a full +-1.
# Measured on TRAIN+VAL only, never TEST. Env: ALPHANODE_FIT_NET_PENALTY / _FIT_MAX_NET.
net_penalty    = 0.5
max_net        = 0.5

[segments]
# Three CONSECUTIVE segments: TRAIN < VAL < TEST. TEST is closed until the very end.
# 4 boundaries suffice: start of train, start of val, start of test, end of test.
; train_start = 2022-01-01
; val_start   = 2025-01-01    # = end of TRAIN
; test_start  = 2026-01-01    # = end of VAL
; test_end    = 2026-07-05

train_start = 2019-09-05    
val_start   = 2021-11-01    
test_start  = 2023-01-01   
test_end    = 2026-07-05
